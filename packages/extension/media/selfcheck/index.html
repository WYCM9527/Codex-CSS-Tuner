<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CSS Tuner Self-check</title>
    <style>
      body {
        margin: 40px;
        font: 14px/1.6 system-ui, sans-serif;
        color: #222;
      }
      .probe {
        padding: 8px 12px;
        border-radius: 6px;
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <p id="note">CSS Tuner is checking what the built-in browser can do. This tab closes by itself when the check is done.</p>
    <div id="probe" class="probe">probe</div>
    <script>
      if (new URLSearchParams(location.search).get('lang') === 'zh-CN') {
        document.documentElement.lang = 'zh-CN';
        document.getElementById('note').textContent = 'CSS Tuner 正在检查内置浏览器的能力，检查完这个标签页会自动关闭。';
      }
    </script>
  </body>
</html>
