packages:
  - packages/*
  - fixtures/tw-react
  - fixtures/react-css
  - fixtures/next16
  - fixtures/demo

allowBuilds:
  # next-intl 带进来的，平台二进制走 optionalDependencies，用不着安装脚本
  '@parcel/watcher': false
  '@swc/core': false
  '@vscode/vsce-sign': false
  esbuild: true

minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.2.1'
  - '@next/env@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - next@16.4.4
