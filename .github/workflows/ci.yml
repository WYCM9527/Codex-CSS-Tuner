name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # 版本取根 package.json 的 packageManager
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Codex 装插件只复制文件夹，提交的构建产物必须和源码对得上
      - name: 构建产物是最新的
        run: |
          if [ -n "$(git status --porcelain plugins/css-tuner)" ]; then
            git status --short plugins/css-tuner
            echo "::error::plugins/css-tuner 里的构建产物和源码对不上：本地 pnpm build 之后一起提交"
            exit 1
          fi
      - run: pnpm check:plugin
      - run: node scripts/mcp-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: css-tuner-plugin
          path: plugins/css-tuner
          include-hidden-files: true
          if-no-files-found: error
