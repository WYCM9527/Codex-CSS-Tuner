name: Release

# 推 v* 标签发布：标签必须和插件清单 plugins/css-tuner/.codex-plugin/plugin.json 的 version 一致。
# 发布 GitHub Release，附上插件文件夹的 zip 和示例页 css-tuner-demo.zip；从插件市场装这个版本用 --ref <标签>。
# 插件清单里的审核用例和使用说明按 releases/latest/download/css-tuner-demo.zip 引用示例页，别改它的文件名。
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 标签和版本号一致
        run: |
          version="v$(node -p "require('./plugins/css-tuner/.codex-plugin/plugin.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 和插件版本 $version 不一致" >&2
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: 构建产物是最新的
        run: |
          if [ -n "$(git status --porcelain plugins/css-tuner)" ]; then
            git status --short plugins/css-tuner
            echo "::error::plugins/css-tuner 里的构建产物和源码对不上：本地 pnpm build 之后一起提交"
            exit 1
          fi
      - run: pnpm check:plugin
      - run: node scripts/mcp-smoke.mjs
      # zip 保留可执行位，scripts/launch-mcp 解压后还能直接跑
      - name: 打包插件
        working-directory: plugins
        run: zip -qr "../css-tuner-${GITHUB_REF_NAME#v}.zip" css-tuner
      - name: 打包示例页
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          cp -R examples/static-demo "$RUNNER_TEMP/demo/css-tuner-demo"
          (cd "$RUNNER_TEMP/demo" && zip -qr "$GITHUB_WORKSPACE/css-tuner-demo.zip" css-tuner-demo)
      - uses: softprops/action-gh-release@v3
        with:
          files: css-tuner-*.zip
          generate_release_notes: true
