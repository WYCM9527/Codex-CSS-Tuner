<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fixture · static-html</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="logo">静态页样例</h1>
      <nav class="nav"><a href="#a">一</a><a href="#b">二</a></nav>
    </header>
    <main class="content">
      <article class="post" data-testid="post">
        <h2 class="post-title">没有开发服务器的页面</h2>
        <p class="post-body">由 css-tuner 内置静态服务托管，应用后自动刷新样式表。</p>
      </article>
      <section class="notes" data-testid="notes">
        <p class="note" data-testid="note-entity">价格 &lt; 100 &amp; 包邮</p>
        <p class="note" data-testid="note-multi">
          这段文字在 HTML 里
          分成了两行
        </p>
        <p class="note" data-testid="note-inline">前面的字 <em>强调</em> 后面的字</p>
      </section>
    </main>
  </body>
</html>
